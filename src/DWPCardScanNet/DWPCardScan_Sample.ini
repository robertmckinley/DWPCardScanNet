;Optional per-crop-region rotation:
; CropRegionRotationX = 90 | 180 | 270   (X = the crop region number)
; Rotates the cropped image CLOCKWISE by the given angle before it is compressed
; and stored in the NIST packet. Omit the key (or use 0) for no rotation.
; Applies to fingerprint (Type-4) and palm (Type-15) crop regions only; the data
; header image (FingerIndex 15, Type-7) is not rotated. 90/270 swap height & width.
; Example:
;   CropRegion1=1
;   CropRegionAwareFingerIndex1=21
;   CropRegionRotation1=90

